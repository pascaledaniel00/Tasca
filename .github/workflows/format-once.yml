name: Temporary code formatter

on:
  push:
    branches: [refactor/solid-codebase]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: refactor/solid-codebase
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format project files
        run: npx --yes prettier@3 --write app.js styles.css index.html package.json .github/workflows/quality.yml
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js styles.css index.html package.json .github/workflows/quality.yml
            git commit -m "Format application source files"
            git push
          fi
