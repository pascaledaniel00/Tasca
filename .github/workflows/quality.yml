name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run finance logic tests
        run: npm test
      - name: Temporary format export
        run: |
          npx --yes prettier@3 --write app.js finance-core.js tests/finance-core.test.js
          node -e "const fs=require('node:fs'); for (const file of ['app.js','finance-core.js','tests/finance-core.test.js']) console.log('PRETTIER_'+file.replace(/[/.]/g,'_').toUpperCase()+'='+fs.readFileSync(file,'base64'))"
      - name: Check code formatting
        run: npm run format:check
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build production site
        run: npm run build
