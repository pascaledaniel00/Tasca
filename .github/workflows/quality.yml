name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automatically format project files
        run: npm run format
      - name: Verify formatting
        run: npm run format:check
      - name: Run finance logic tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Save formatting fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html package.json .prettierrc.json .github/workflows/quality.yml finance-core.js tests/finance-core.test.js worker.js mobile-nav-fix.css wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-format project files"
            git push
          else
            echo "Nessuna correzione di formattazione da salvare."
          fi
