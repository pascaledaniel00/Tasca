name: Generate VAPID keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Mancano CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID nei GitHub Secrets. Nessuna chiave è stata generata."
            exit 1
          fi

      - name: Generate VAPID key pair and store it in Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/vapid.env"
          import { generateKeyPairSync } from 'node:crypto';
          const { privateKey } = generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
          const jwk = privateKey.export({ format: 'jwk' });
          const decode = (value) => Buffer.from(value, 'base64url');
          const publicKey = Buffer.concat([
            Buffer.from([4]),
            decode(jwk.x),
            decode(jwk.y)
          ]).toString('base64url');
          console.log('VAPID_PUBLIC_KEY=' + publicKey);
          console.log('VAPID_PRIVATE_KEY=' + jwk.d);
          NODE

          source "$RUNNER_TEMP/vapid.env"
          npm install --global wrangler@4
          printf '%s' "$VAPID_PRIVATE_KEY" | wrangler secret put VAPID_PRIVATE_KEY --name tasca
          printf '%s' "$VAPID_PUBLIC_KEY" | wrangler secret put VAPID_PUBLIC_KEY --name tasca

          {
            echo "## Chiavi VAPID configurate"
            echo
            echo "Le due chiavi sono state salvate come secrets del Worker Cloudflare `tasca`."
            echo
            echo "**Chiave pubblica (da usare nel frontend):**"
            echo
            echo "`$VAPID_PUBLIC_KEY`"
            echo
            echo "La chiave privata non viene stampata né salvata nei log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/vapid.env"
