name: Esporta registro iscrizioni Tasca

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tasca-user-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Genera Excel da Supabase Auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_supabase_users.py

      - name: Pubblica Excel come artifact privato della run
        uses: actions/upload-artifact@v4
        with:
          name: tasca-iscrizioni-${{ github.run_number }}
          path: artifacts/tasca-iscrizioni.xlsx
          if-no-files-found: error
          retention-days: 30
