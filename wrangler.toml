name = "tasca"
main = "worker.js"
compatibility_date = "2026-10-28"

[ai]
binding = "AI"

[vars]
SUPABASE_URL = "https://njgmlxyecjyreieqcpwk.supabase.co"

[previews.ai]
binding = "AI"

[previews.vars]
# Isolated preview target: never writes to the production Supabase project.
SUPABASE_URL = "https://preview.invalid"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
