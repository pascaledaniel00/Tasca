name = "tasca"
main = "worker.js"
compatibility_date = "2026-10-28"

[ai]
binding = "AI"

[vars]
SUPABASE_URL = "https://njgmlxyecjyreieqcpwk.supabase.co"

[triggers]
crons = ["0 * * * *", "0 0 * * SUN", "0 1 * * SUN"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
